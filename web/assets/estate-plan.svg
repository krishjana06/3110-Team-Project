    <path d="M665 394h215v22H687v50h-22zM702 394v22M744 394v22M790 394v22M834 394v22"/><circle cx="804" cy="401" r="4"/><circle cx="817" cy="401" r="4"/><circle cx="804" cy="410" r="4"/><circle cx="817" cy="410" r="4"/><rect x="742" y="436" width="80" height="22" rx="2"/>
  </g>
  <g stroke="#aa9474" stroke-width="2">
    <!-- Exterior windows. -->
    <path d="M123 26h76M400 26h65M509 26h65M718 26h87M54 68v55M906 68v55M54 250v50M906 250v50M54 425v50M906 425v50M120 518h80M718 518h87"/>
