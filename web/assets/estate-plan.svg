    <rect x="713" y="255" width="111" height="37" rx="7"/><path d="M722 244h18v8h-18zM760 244h18v8h-18zM798 244h18v8h-18zM722 296h18v8h-18zM760 296h18v8h-18zM798 296h18v8h-18z"/><circle cx="768" cy="274" r="6"/>
