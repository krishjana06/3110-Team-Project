    <path d="M77 392h113M77 392v77M105 392v13M133 392v13M161 392v13M77 418h13M77 444h13M240 410h43v15h-43z"/><circle cx="126" cy="442" r="17"/><path d="M126 425v34M109 442h34M114 430l24 24M138 430l-24 24"/><circle cx="269" cy="450" r="12"/>
